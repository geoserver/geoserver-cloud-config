# This file contains the default and sample externalized configuration for the GeoServer Control Flow extension
# and is automatically imported by geoserver.yml
#
# When geoserver.extension.control-flow.use-properties-file is false (default), the configuration properties defined
# under geoserver.extension.control-flow.properties are used for devOps friendlyness.
#
# Additionally, using this externalized configuration allows to use SpEL expressions (and specially the cpu.cores property placeholder)
# to assign dynamic limits based on the allocated number of CPU cores in each container.
#
# For example, a property value of "${cpu.cores} * 2" will resolve to two times the number of cores allocated to the container.
# Following standard Spring Boot YAML configuratio guidelines, it is recommended to enclose property names in '[]'. Additionally
# it is recommended to enclose values in "" to ensure the expressions are lazily evaluated by our custom resolver.
#
# Rules can also be set or overridden per container through environment variables, which take precedence over this
# file on a per-rule basis. Spring Boot's relaxed binding is not obvious for map keys: uppercase the whole property
# path, turn dots into underscores, and drop the dash in control-flow. Everything after PROPERTIES_ becomes the rule
# key, with underscores turning back into dots. For example:
#
#   GEOSERVER_EXTENSION_CONTROLFLOW_PROPERTIES_OWS_GLOBAL="${cpu.cores} * 4"
#   GEOSERVER_EXTENSION_CONTROLFLOW_PROPERTIES_OWS_WMS_GETMAP=6
#   GEOSERVER_EXTENSION_CONTROLFLOW_PROPERTIES_IP=6
#   CONTROL_FLOW=false    # shorthand to disable the extension in a service, see 'enabled' below
#
# Rule keys that cannot be spelled as an environment variable name, such as output-format rules containing a slash,
# can be set through SPRING_APPLICATION_JSON instead:
#
#   SPRING_APPLICATION_JSON='{"geoserver.extension.control-flow.properties":{"[ows.wms.getmap.image/png]":"2"}}'
#
# Either mechanism adds rules or overrides a value defined here; neither can remove a rule from this file.
#
# Check out the examples bellow, uncomment them and teak them as necessary.
# -----------
# The control-flow module for GeoServer allows the administrator to control and throttle requests
#
# Performance: when rendering is CPU-bound on local data sources, the maximum GetMap throughput is usually achieved
# with about 2 times the number of CPU cores running in parallel; with network-backed sources (remote databases,
# object storage) the CPU is used less and higher limits keep it busy. The defaults below lean toward the latter,
# which is the common GeoServer Cloud deployment profile; dial them down for CPU-bound local-disk workloads.
# Resource control: The WMS request limits allow to control the amount of memory used per request, but an OutOfMemoryError is still possible if too
# many requests run in parallel.
# Fairness: a single user should not be able to overwhelm the server with a lot of requests, leaving other users with tiny slices of the overall processing power.
#
# The control flow method does not normally reject requests, it just queues up those in excess and executes them late. However, it’s possible to
# configure the module to reject requests that have been waited in queue for too long.
#
# Unlike vanilla GeoServer's single control-flow.properties, each GeoServer Cloud service loads only the rules
# that apply to it. This first document holds the universal settings; the per-service documents below, activated
# by each service's own profile (every application runs with spring.profiles.include: ${spring.application.name}),
# add the service-specific rules. A profile document can add rules or override a default value, but cannot remove
# a rule defined here: keep this document to settings that make sense on every OWS-serving service.

geoserver:
  extension:
    control-flow:
      # Enabled/disable the extension. The control-flow placeholder allows to use a short environment variable. E.g. export CONTROL_FLOW=false
      enabled: ${control-flow:true}
      # Whether to use the traditional control-flow.properties file in the data directory instead of the externalized config properties
      use-properties-file: false
      properties:
        ##############################################
        ### TIMEOUT
        ### Number of seconds a request can stay queued waiting for execution. If the request does
        ### not enter execution before the timeout expires it will be rejected.
        '[timeout]': 10
        ##############################################
        ### Total OWS request count
        ### ows.global: Number of OWS requests executing in parallel in this service instance.
        ### Disabled by default: a global cap indiscriminately throttles IO-bound traffic (WFS GetFeature,
        ### serving already-seeded tiles) that does not need it, and the per-operation rules in the
        ### per-service documents below protect the genuinely heavy work. Uncomment for a hard ceiling.
        #'[ows.global]': "${cpu.cores} * 8"
        ##############################################
        ### PER USER CONCURRENCY CONTROL
        ### There are two mechanisms to identify user requests. The first one is cookie based, so it will work fine for
        ### browsers but not as much for other kinds of clients. The second one is ip based, which works for any type of
        ### client but that can limit all the users sitting behind the same router
        ### user: maximum number of requests a single user can execute in parallel.
        ### ip: maximum number of requests a single ip address can execute in parallel.
        #'[user]': "${cpu.cores}"
        #'[ip]': "6"
        ### It is also possible to make this a bit more specific and throttle a single ip address instead by using the following:
        ### ip.<ip_addr>: <count>
        ### Where <count> is the maximum number of requests the ip specified in <ip_addr> will execute in parallel.
        #'[ip.10.0.0.1]': "3 * ${cpu.cores}"
        ### To reject requests from a list of ip addresses:
        #'[ip.blacklist]': "192.168.0.7, 192.168.0.8"
        ##############################################
        ### PER USER RATE CONTROL
        ### The rate control rules allow to setup the maximum number of requests per unit of time, based either on a cookie or IP address.
        ### These rules look as follows (see “Per user concurrency control” for the meaning of “user” and “ip”):
        ### user.ows[.<service>[.<request>[.<outputFormat>]]]=<requests>/<unit>[;<delay>s]
        ### ip.ows[.<service>[.<request>[.<outputFormat>]]]=<requests>/<unit>[;<delay>s]
        #'[user.ows.wms.getmap]': "30/s"
        #'[user.ows.wps.execute]': "1000/d;30s"
        ##############################################

---
### PER REQUEST CONTROL for WMS: ows.<service>[.<request>[.<outputFormat>]]=<count>
### <request> for the wms service can be GetMap, GetFeatureInfo, DescribeLayer, GetLegendGraphics, GetCapabilities
### <outputFormat>, optional, for the wms GetMap request could be image/png, image/gif and so on.
spring.config.activate.on-profile: wms
geoserver.extension.control-flow.properties:
  '[ows.wms]': "${cpu.cores} * 8" # umbrella for GetFeatureInfo/DescribeLayer/GetCapabilities, far lighter than GetMap
  '[ows.wms.getmap]': "${cpu.cores} * 4" # rendering cap; per-request memory is bounded by the WMS max rendering memory setting

---
### WFS has no service-specific defaults; ows.global from the first document applies. Examples:
spring.config.activate.on-profile: wfs
#geoserver.extension.control-flow.properties:
#  '[ows.wfs.getfeature]': "${cpu.cores} * 2"
#  '[ows.wfs.getfeature.application/msexcel]': 2

---
### WCS has no service-specific defaults; ows.global from the first document applies. Example:
spring.config.activate.on-profile: wcs
#geoserver.extension.control-flow.properties:
#  '[ows.wcs.getcoverage]': "${cpu.cores}"

---
spring.config.activate.on-profile: wps
geoserver.extension.control-flow.properties:
  '[ows.wps.execute]': "${cpu.cores}"

---
### GeoWebCache contributes three cached tiles services: WMS-C, TMS, and WMTS; the ows.gwc rule throttles them.
### ows.wms.getmap engages only for seed/truncate jobs: their tile rendering dispatches an internal WMS GetMap
### outside of a user request. A tile-miss render during a user request is a nested dispatch that control-flow
### skips by design (the ows.gwc rule already throttles that request).
spring.config.activate.on-profile: gwc
geoserver.extension.control-flow.properties:
  '[ows.gwc]': "${cpu.cores} * 8" # serving seeded tiles is IO-bound; misses render through this same slot
  '[ows.wms.getmap]': "${cpu.cores} * 4"

---
### The REST API does not dispatch OWS requests; control-flow has nothing to throttle here.
spring.config.activate.on-profile: restconfig
geoserver.extension.control-flow.enabled: false

---
### The web admin UI does not dispatch OWS requests; control-flow has nothing to throttle here.
spring.config.activate.on-profile: webui
geoserver.extension.control-flow.enabled: false
